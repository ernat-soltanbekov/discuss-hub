services:
  forum:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADDR: ":8080"
      DB_PATH: /app/data/forum.db
      COOKIE_SECURE: "false"
    volumes:
      - forum-data:/app/data
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
volumes:
  forum-data:
